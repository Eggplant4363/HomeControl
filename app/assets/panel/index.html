<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="format-detection" content="telephone=no">
  <title>中控屏</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <div class="topbar">
      <div class="clock">
        <div class="time" id="time">--:--</div>
        <div class="date" id="date"></div>
      </div>
      <div class="weather" id="weather"></div>
      <div class="spacer"></div>
      <div class="who" id="who"></div>
      <div class="status" id="status">
        <span class="dot"></span><span id="statusText">连接中…</span>
      </div>
      <button class="gear" id="editBtn" type="button" aria-label="编辑卡片" title="编辑卡片"></button>
      <button class="gear" id="gear" type="button" aria-label="设置" title="设置"></button>
    </div>

    <div class="toolbar">
      <div class="scenes" id="scenes"></div>
      <div class="tabs" id="tabs"></div>
    </div>

    <div class="edit-bar" id="editBar"></div>
    <div class="grid" id="grid"></div>
    <div class="view" id="view"></div>
  </div>

  <!-- ============ 负一屏 · 音乐（右滑进入） ============ -->
  <div class="m-scrim" id="mScrim"></div>
  <div class="music" id="music" aria-hidden="true">
    <div class="m-head">
      <div class="m-title">音乐</div>
      <div class="m-status" id="mStatus"><span class="dot"></span><span>连接中…</span></div>
    </div>

    <div class="m-body">
      <div class="m-left">
        <div class="m-cover" id="mCover"></div>
        <div class="m-meta" id="mMeta">
          <div class="m-song" id="mSong">未在播放</div>
          <div class="m-artist" id="mArtist"></div>
          <div class="m-album" id="mAlbum"></div>
        </div>
        <div class="m-lyrics" id="mLyrics"></div>
        <div class="m-progress">
          <div class="m-bar" id="mBar">
            <div class="m-fill" id="mFill"></div>
            <div class="m-knob" id="mKnob"></div>
          </div>
          <div class="m-times"><span id="mPos">0:00</span><span id="mDur">0:00</span></div>
        </div>
        <div class="m-ctl">
          <button class="m-btn" id="mPrev" type="button" data-mact="prev" aria-label="上一首"></button>
          <button class="m-btn m-play" id="mPlay" type="button" data-mact="toggle" aria-label="播放 / 暂停"></button>
          <button class="m-btn" id="mNext" type="button" data-mact="next" aria-label="下一首"></button>
          <button class="m-btn m-mini" id="mMode" type="button" data-mact="mode" aria-label="播放模式：顺序、循环、随机（点击切换）"></button>
          <button class="m-btn m-mini" id="mQueue" type="button" data-mact="queue" aria-label="正在播放列表"></button>
        </div>
        <div class="m-vol">
          <span class="m-vol-ico" id="mVolIco"></span>
          <div class="m-vbar" id="mVol">
            <div class="m-fill" id="mVolFill"></div>
            <div class="m-knob" id="mVolKnob"></div>
          </div>
          <span class="m-vol-pct" id="mVolPct">70%</span>
        </div>
      </div>

      <div class="m-right">
        <div class="m-crumb" id="mCrumb"></div>
        <div class="m-list" id="mList"></div>
      </div>
    </div>
  </div>

  <div class="mask" id="mask"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-inner" id="sheetInner"></div>
  </div>
  <div class="dim" id="dim">
    <div class="dim-time" id="dimTime">--:--</div>
    <div class="dim-hint">轻触屏幕唤醒</div>
  </div>
  <div class="toast" id="toast"></div>
  <div class="boot" id="boot">正在加载控制面板…</div>

  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/backend.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/music.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
